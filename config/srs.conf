listen              1935;
max_connections     10000;
daemon              on;
pid                 ./logs/srs.pid;
srs_log_tank        file;
srs_log_file        ./logs/srs.log;
utc_time            on;

worker              4;
srs_worker_cpu_affinity 1,3,5,7;

vhost __defaultVhost__ {
    gop_cache       on;
    gop_cache_count 1024;
    queue_length    1024;
    min_latency     on;

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html/hls;
        hls_fragment    2;
        hls_window      10;
        hls_cleanup     on;
        hls_dispose     30;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_segment_duration 1.8-2.2;
    }

    http_flv {
        enabled         on;
        flv_latency     0;
    }

    ingest {
        enabled on;
        input file:///data/stream/live/{stream}.flv;
        on_demand;
        cache 1024;
    }
}

stream_caster {
    enabled on;
    rtmp {
        enabled on;
        cache 1024;
        mode broadcast;
    }
}

stats {
    enabled         on;
    stats_interval  30;
    stats_rotation  360;
    stats_file      ./logs/srs.stats.log;
}
