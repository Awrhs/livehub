version: '3.8'

services:
  srs:
    image: ossrs/srs:5
    container_name: srs
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    volumes:
      - ./config/srs.conf:/usr/local/srs/conf/srs.conf:ro
      - ./logs:/usr/local/srs/logs
      - hls_data:/mnt/hls
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
    restart: always

  nginx-rtmp:
    image: tiangolo/nginx-rtmp
    container_name: nginx-rtmp
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - hls_data:/mnt/hls
      - vod_data:/mnt/vod
      - timeshift_data:/mnt/timeshift
    ports:
      - "1936:1936"
      - "8081:8080"
    depends_on:
      - backend
    restart: always

  backend:
    build: .
    container_name: iptv-backend
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - hls_data:/mnt/hls
      - vod_data:/mnt/vod
      - timeshift_data:/mnt/timeshift
    ports:
      - "8000:8000"
    environment:
      - SRS_HOST=srs
      - NGINX_HOST=nginx-rtmp
      - ENABLE_AUTH=true
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET before starting docker compose}
      - CLUSTER_NODES=backend
      - HLS_BASE_PATH=/mnt/hls
      - VOD_BASE_PATH=/mnt/vod
      - TIMESHIFT_BASE_PATH=/mnt/timeshift
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    restart: always

volumes:
  hls_data:
  vod_data:
  timeshift_data:
  prometheus_data:
