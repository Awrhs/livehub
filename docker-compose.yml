version: '3.8'

services:
  srs:
    image: ossrs/srs:5
    container_name: srs
    volumes:
      - ./config/srs.conf:/usr/local/srs/conf/srs.conf
      - ./logs:/usr/local/srs/logs
      - hls_data:/usr/local/srs/objs/nginx/html/hls
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
    restart: always
    network_mode: "host"

  nginx-rtmp:
    image: tiangolo/nginx-rtmp
    container_name: nginx-rtmp
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - hls_data:/mnt/hls
      - vod_data:/mnt/vod
      - timeshift_data:/mnt/timeshift
    ports:
      - "1936:1936"
      - "8081:8080"
    restart: always
    network_mode: "host"

  backend:
    build: .
    container_name: iptv-backend
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - hls_data:/mnt/hls
      - vod_data:/mnt/vod
      - timeshift_data:/mnt/timeshift
    ports:
      - "8000:8000"
    environment:
      - SRS_HOST=127.0.0.1
      - NGINX_HOST=127.0.0.1
      - ENABLE_AUTH=true
      - JWT_SECRET=your-production-secret-key-change-this
      - CLUSTER_NODES=127.0.0.1
    depends_on:
      - srs
      - nginx-rtmp
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    network_mode: "host"
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: always

volumes:
  hls_data:
  vod_data:
  timeshift_data:
  prometheus_data:
