name: C++ Build & Test

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "gcc no-deps (stubs)"
            cc: gcc
            cxx: g++
            deps: ""
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON"
          - name: "gcc full (OpenSSL + FFmpeg)"
            cc: gcc
            cxx: g++
            deps: "libssl-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev"
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON"
          - name: "clang Release"
            cc: clang
            cxx: clang++
            deps: "libssl-dev"
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release"

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ${{ matrix.cc }} ${{ matrix.deps }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S cpp -B cpp/build ${{ matrix.cmake_flags }} -DENABLE_BENCHMARKS=ON

      - name: Build
        run: cmake --build cpp/build -j"$(nproc)" -- -k  # -k: 遇错继续，一次暴露全部编译错误

      - name: Run unit tests
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Build benchmarks
        run: cmake --build cpp/build --target bench_buffer bench_lru bench_http bench_concurrent -j"$(nproc)"

  e2e:
    name: "E2E (ffmpeg 推拉流, ASan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ffmpeg netcat-openbsd libssl-dev

      - name: Build (Debug + ASan)
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF
          cmake --build cpp/build --target streaming_server -j"$(nproc)"

      - name: Run E2E
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=0:halt_on_error=0"
          UBSAN_OPTIONS: "print_stacktrace=1"
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
        run: cpp/tests/e2e/e2e_core.sh "$PWD/cpp/build/bin/streaming_server"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          retention-days: 7
