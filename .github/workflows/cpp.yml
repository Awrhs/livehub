name: C++ Build & Test

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "gcc no-deps (stubs)"
            cc: gcc
            cxx: g++
            deps: ""
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON"
          - name: "gcc full (OpenSSL + FFmpeg)"
            cc: gcc
            cxx: g++
            deps: "libssl-dev libsrt-openssl-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev"
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DENABLE_WERROR=ON"
          - name: "clang Release"
            cc: clang
            cxx: clang++
            deps: "libssl-dev"
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release"

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ${{ matrix.cc }} ${{ matrix.deps }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S cpp -B cpp/build ${{ matrix.cmake_flags }} -DENABLE_BENCHMARKS=ON

      - name: Build
        run: cmake --build cpp/build -j"$(nproc)" -- -k  # -k: 遇错继续，一次暴露全部编译错误

      - name: Run unit tests
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Build benchmarks
        run: cmake --build cpp/build --target bench_buffer bench_lru bench_http bench_concurrent -j"$(nproc)"

  e2e:
    name: "E2E (ffmpeg 推拉流, ASan)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ffmpeg netcat-openbsd libssl-dev libsrt-openssl-dev gdb

      - name: Build (Debug + ASan)
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF
          cmake --build cpp/build --target streaming_server -j"$(nproc)"

      - name: Run E2E
        timeout-minutes: 10
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=0:halt_on_error=0"
          UBSAN_OPTIONS: "print_stacktrace=1"
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
        run: cpp/tests/e2e/e2e_core.sh "$PWD/cpp/build/bin/streaming_server"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          retention-days: 7

  e2e-tsan:
    name: "E2E (ThreadSanitizer)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ffmpeg netcat-openbsd libssl-dev libsrt-openssl-dev gdb

      - name: Build (Debug + TSan)
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF
          cmake --build cpp/build --target streaming_server -j"$(nproc)"

      - name: Run E2E under TSan
        timeout-minutes: 10
        env:
          TSAN_OPTIONS: "halt_on_error=0:second_deadlock_stack=1:history_size=4:suppressions=${{ github.workspace }}/cpp/tests/tsan.supp"
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
        run: cpp/tests/e2e/e2e_core.sh "$PWD/cpp/build/bin/streaming_server"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tsan-artifacts
          path: e2e-artifacts
          retention-days: 7

  docker:
    name: "Docker 镜像构建 + 冒烟测试"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t streaming-server:ci cpp

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Smoke test (RTMP push -> HLS/FLV pull, docker stop)
        run: |
          set -u
          docker run -d --name sms -p 8080:8080 -p 1935:1935 \
            -e STREAM_JWT_SECRET=ci-secret-ci-secret-ci-secret-01 \
            streaming-server:ci
          for i in $(seq 1 50); do curl -sf --max-time 2 localhost:8080/api/health && break; sleep 0.2; done
          echo
          ffmpeg -hide_banner -loglevel warning -re -f lavfi -i testsrc2=size=320x240:rate=25 \
            -f lavfi -i sine=frequency=1000 -c:v libx264 -preset ultrafast -g 50 -pix_fmt yuv420p \
            -c:a aac -t 25 -f flv rtmp://127.0.0.1:1935/live/smoke &
          sleep 10
          ffmpeg -hide_banner -nostats -i http://127.0.0.1:8080/live/smoke.flv -t 3 -f null - 2>&1 | grep -E 'frame=' | tail -1
          ffmpeg -hide_banner -nostats -i http://127.0.0.1:8080/live/smoke.m3u8 -t 3 -f null - 2>&1 | grep -E 'frame=' | tail -1
          frames=$(ffmpeg -hide_banner -nostats -i http://127.0.0.1:8080/live/smoke.m3u8 -t 3 -f null - 2>&1 \
                   | grep -oE 'frame= *[0-9]+' | tail -1 | grep -oE '[0-9]+')
          echo "HLS frames: ${frames:-0}"
          wait
          start=$(date +%s)
          docker stop -t 15 sms
          rc=$(docker inspect sms --format '{{.State.ExitCode}}')
          echo "docker stop took $(( $(date +%s) - start ))s, exit code $rc"
          docker logs sms 2>&1 | tail -80
          [ "${frames:-0}" -ge 60 ] && [ "$rc" = 0 ]

  soak:
    name: "Soak（Release，6 分钟连接反复建立/销毁）"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ffmpeg libssl-dev libsrt-openssl-dev

      - name: Build (Release)
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF
          cmake --build cpp/build --target streaming_server -j"$(nproc)"

      - name: Soak
        timeout-minutes: 12
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/soak-artifacts
        run: cpp/tests/e2e/soak.sh "$PWD/cpp/build/bin/streaming_server" 360

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-artifacts
          path: soak-artifacts
          retention-days: 7

  e2e-ext:
    name: "E2E 扩展模块（HEVC/RTSP/SRT/DVR）"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ffmpeg libssl-dev libsrt-openssl-dev

      - name: Build (Debug + ASan)
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF
          cmake --build cpp/build --target streaming_server -j"$(nproc)"

      - name: Run extension E2E
        timeout-minutes: 8
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=0"
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/ext-artifacts
        run: cpp/tests/e2e/e2e_ext.sh "$PWD/cpp/build/bin/streaming_server"

      - name: Run ops E2E (webhook / rate limit / connection limit)
        if: always()
        timeout-minutes: 5
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=0"
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/ext-artifacts/ops
        run: cpp/tests/e2e/e2e_ops.sh "$PWD/cpp/build/bin/streaming_server"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ext-artifacts
          path: ext-artifacts
          retention-days: 7
