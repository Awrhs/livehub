name: LiveHub

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'platform/**'
      - 'web/**'
      - 'cpp/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.github/workflows/livehub.yml'
  pull_request:

concurrency:
  group: livehub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 本机内存不足以运行 Go/Node 工具链：依赖锁文件与格式化由 CI 生成并提交回仓库
  housekeeping:
    name: 锁文件与格式化
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: go mod tidy + gofmt
        working-directory: platform
        run: |
          go mod tidy
          gofmt -w .
      - name: npm 锁文件
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm install --package-lock-only --no-audit --no-fund
      - name: 提交变更
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "livehub-bot"
            git config user.email "livehub-bot@users.noreply.github.com"
            git add -A -- platform $(test -d web && echo web)
            git commit -m "chore: 更新依赖锁文件与格式化 [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi

  go:
    name: Go 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: platform/go.mod
      - name: vet + test
        working-directory: platform
        run: |
          go mod tidy
          go vet ./...
          go test -race -count=1 ./...

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖并构建
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  e2e:
    name: 全链路 E2E（平台 + 媒体服务器 + ffmpeg）
    needs: [go, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ccache ffmpeg jq pkg-config libssl-dev libsrt-openssl-dev libsrtp2-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-release-${{ hashFiles('cpp/src/**', 'cpp/include/**', 'cpp/CMakeLists.txt', 'cpp/src/CMakeLists.txt') }}
          restore-keys: ccache-release-
      - name: 构建媒体服务器（Release）
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build cpp/build --target streaming_server -j"$(nproc)"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: platform/internal/webui/dist
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: platform/go.mod
      - name: 构建 LiveHub
        working-directory: platform
        run: |
          go mod tidy
          go build -o livehub ./cmd/livehub
      - name: 运行 E2E
        id: e2e
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
        run: platform/e2e/e2e.sh "$PWD/platform/livehub" "$PWD/cpp/build/bin/streaming_server"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 浏览器 E2E（Playwright + Chrome）
        if: success() || steps.e2e.conclusion == 'failure'
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
        run: |
          cd web && npm install --no-audit --no-fund && cd ..
          platform/e2e/browser.sh "$PWD/platform/livehub" "$PWD/cpp/build/bin/streaming_server"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livehub-e2e
          path: e2e-artifacts
          retention-days: 7

  docker:
    name: Docker 一体化镜像冒烟测试
    needs: [go, web]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: livehub:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 冒烟测试（容器内推流与播放）
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq
          docker run -d --name lh -p 8000:8000 -p 1935:1935 -e LIVEHUB_BCRYPT_COST=4 livehub:ci
          for i in $(seq 1 60); do
            [ "$(curl -s localhost:8000/healthz | jq -r .media 2>/dev/null)" = "true" ] && break; sleep 1
          done
          curl -s localhost:8000/healthz
          J=/tmp/jar
          H=(-H 'X-Requested-With: livehub' -H 'Content-Type: application/json' -b $J -c $J)
          curl -s "${H[@]}" -X POST localhost:8000/api/v1/auth/register -d '{"username":"admin1","password":"password123"}' >/dev/null
          KEY=$(curl -s "${H[@]}" localhost:8000/api/v1/me | jq -r .channel.publish_key)
          ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine -t 25 \
            -c:v libx264 -preset ultrafast -g 50 -pix_fmt yuv420p -c:a aac -f flv "rtmp://127.0.0.1:1935/live/$KEY" &
          ok=0
          for i in $(seq 1 30); do
            [ "$(curl -s localhost:8000/api/v1/channels/admin1 | jq -r .channel.is_live)" = "true" ] && ok=1 && break; sleep 1
          done
          [ $ok = 1 ] || { docker logs lh | tail -80; exit 1; }
          ffprobe -v error -show_entries stream=codec_name -of csv=p=0 http://127.0.0.1:8000/live/admin1.flv | tee /tmp/probe
          grep -q h264 /tmp/probe
          curl -s localhost:8000/ | grep -q '<div id="root">'
          docker exec lh /opt/livehub/livehub -version
          wait
          echo "Docker 冒烟测试通过"
      - name: 容器日志
        if: always()
        run: docker logs lh 2>&1 | tail -100 || true
