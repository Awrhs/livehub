name: LiveHub

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'platform/**'
      - 'web/**'
      - 'cpp/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.github/workflows/livehub.yml'
  pull_request:

concurrency:
  group: livehub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 本机内存不足以运行 Go/Node 工具链：依赖锁文件与格式化由 CI 生成并提交回仓库
  housekeeping:
    name: 锁文件与格式化
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: go mod tidy + gofmt
        working-directory: platform
        run: |
          go mod tidy
          gofmt -w .
      - name: npm 锁文件
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm install --package-lock-only --no-audit --no-fund
      - name: 提交变更
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "livehub-bot"
            git config user.email "livehub-bot@users.noreply.github.com"
            git add -A platform web
            git commit -m "chore: 更新依赖锁文件与格式化 [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi

  go:
    name: Go 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: platform/go.mod
      - name: vet + test
        working-directory: platform
        run: |
          go mod tidy
          go vet ./...
          go test -race -count=1 ./...
